<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRKA - Nalog za izvedbo in Kalkulacija</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="tarife_prevozov.js?v=2"></script>
    <script src="customer_contacts_seed.js?v=1"></script>
    <script src="_projects_index.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #06b6d4 100%);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(203, 213, 225, 0.8);
            --accent-color: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --text-main: #0f172a;
            --text-muted: #475569;
            --card-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            zoom: 90%;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 1850px;
            width: 100%;
            margin: 0 auto;
        }

        /* HEADER PANEL - IDENTIČNA KOT V POLI2 */
        .header-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 1.25rem;
            border-radius: 14px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.25rem;
            box-shadow: var(--card-shadow);
        }

        .header-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.55rem 0.65rem;
            background: #475569;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        body.light-mode input, body.light-mode select, body.light-mode textarea {
            background: #ffffff;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* 2-COLUMN MAIN LAYOUT */
        .main-layout {
            display: grid;
            grid-template-columns: 540px 1fr;
            gap: 1.25rem;
            align-items: start;
        }

        @media (max-width: 1400px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.25rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.75rem;
        }

        .calc-pill {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        /* WORK ORDER LIVE PREVIEW */
        .preview-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 1rem;
        }

        .preview-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .action-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        .action-btn.secondary {
            background: #334155;
            color: #cbd5e1;
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background: #475569;
            color: #ffffff;
        }

        .action-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* EXACT WORK ORDER SHEET (NALOG ZA IZVEDBO KRKA) */
        .krka-dn-sheet {
            background: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 28px;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 11pt;
            line-height: 1.35;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
        }

        .krka-dn-sheet * {
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif !important;
            color: #000000;
        }

        /* Divider lines */
        .dn-sep-double {
            border-bottom: 3px double #000000;
            margin: 6px 0;
            height: 0;
        }

        .dn-sep-single {
            border-bottom: 1px solid #000000;
            margin: 5px 0;
            height: 0;
        }

        .dn-sep-dotted {
            border-bottom: 1px dotted #555555;
            margin: 4px 0;
            height: 0;
        }

        /* Yellow and gray badges */
        .badge-yellow {
            background-color: #ffff00 !important;
            color: #000000 !important;
            padding: 1px 4px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-gray {
            background-color: #d1d5db !important;
            color: #000000 !important;
            padding: 1px 6px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-warning-box {
            background-color: #ffff00 !important;
            color: #000000 !important;
            text-align: center;
            font-weight: 900;
            font-style: italic;
            font-size: 11.5pt;
            letter-spacing: 0.5px;
            padding: 3px 6px;
            margin: 4px 0;
            border: 1px dashed #000000;
        }

        /* Print styles */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .header-panel, .left-column, .preview-toolbar, .no-print {
                display: none !important;
            }
            .main-layout {
                display: block !important;
            }
            .preview-wrapper {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                background: transparent !important;
            }
            .krka-dn-sheet {
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                font-size: 10pt;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER PANEL IDENTIČNA KOT V POLI2 -->
    <div class="header-panel">
        <!-- ROW 1: IZDELEK & GUMBI -->
        <div class="header-group" style="grid-column: span 3;">
            <label for="calc-project-name">Izdelek</label>
            <div style="display: flex; gap: 0.2rem; position: relative;">
                <input type="text" id="calc-project-name" placeholder="Vnesite izdelek" style="flex: 1;"
                    value="" oninput="updateWorkOrderLive()">
                <button id="btn-my-projects" onclick="toggleProjectsDropdown()"
                    style="width: auto; background: #64748b; border: none; border-radius: 8px; color: white; cursor: pointer; padding: 0 10px; font-size: 0.8rem; font-weight: bold;">
                    MOJI PROJEKTI ˇ
                </button>
                <!-- DROPDOWN ZA PROJEKTE -->
                <div id="projects-dropdown-list"
                    style="display: none; position: absolute; top: 100%; right: 0; width: 420px; background: #1e293b; border: 2px solid #64748b; border-radius: 12px; max-height: 520px; overflow: hidden; z-index: 2000; margin-top: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); flex-direction: column;">
                    <div style="padding: 10px; border-bottom: 2px solid #334155; background: #1e293b;">
                        <input type="text" id="project-search-input" placeholder="🔍 Išči po vseh ponudbah (stranka, šifra, ime)..."
                            style="width: 100%; padding: 8px 10px; border-radius: 6px; background: #0f172a; border: 1px solid #475569; color: white; font-size: 0.82rem;"
                            oninput="renderSavedProjects()">
                        <div style="margin-top: 8px; display: flex; gap: 5px; align-items: center;">
                            <button type="button" id="btn-filter-all" onclick="setProjectFilterMode('all')"
                                style="flex: 1.2; background: #3b82f6; color: white; border: none; padding: 5px 6px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; cursor: pointer;">
                                🌐 VSE NA STREŽNIKU (<span id="count-filter-all">...</span>)
                            </button>
                            <button type="button" id="btn-filter-type" onclick="setProjectFilterMode('type')"
                                style="flex: 1; background: #334155; color: #94a3b8; border: 1px solid #475569; padding: 5px 6px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; cursor: pointer;">
                                💊 KRKA (<span id="count-filter-type">...</span>)
                            </button>
                            <button type="button" onclick="fetchServerProjects().then(() => renderSavedProjects())"
                                style="background: #0f172a; border: 1px solid #475569; color: #38bdf8; padding: 5px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;"
                                title="Ponovno preveri strežnik">
                                🔄
                            </button>
                        </div>
                    </div>
                    <div id="projects-list-content" style="overflow-y: auto; flex: 1; max-height: 300px;"></div>
                </div>
            </div>
            <!-- GUMBI ZA E-POŠTO IN DATOTEKO -->
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <button type="button" onclick="openEmailModal()" id="btn-open-email-modal"
                    style="background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; padding: 5px 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;">
                    ✉️ E-POŠTA STRANKE
                </button>
                <div id="attached-email-badge" style="display:none; align-items: center; gap: 6px; background: rgba(2, 132, 199, 0.2); border: 1px solid #0284c7; border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; color: #38bdf8;">
                    <span>✉️ <strong id="attached-email-summary">Mail stranke</strong></span>
                    <button type="button" onclick="openEmailModal()" style="background: #0284c7; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 0.75rem;">👁️ Poglej</button>
                    <button type="button" onclick="removeAttachedEmail()" style="background: rgba(239, 68, 68, 0.3); color: #f87171; border: 1px solid #ef4444; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.75rem;">✕</button>
                </div>
                <button type="button" onclick="document.getElementById('pdf-file-input').click()"
                    style="background: linear-gradient(135deg, #ec4899, #8b5cf6); border: none; border-radius: 8px; color: white; padding: 5px 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;">
                    📎 PRIPNI DATOTEKO (PDF / Excel / Word / Slike)
                </button>
                <input type="file" id="pdf-file-input" accept=".pdf,.xlsx,.xls,.docx,.doc,.jpg,.jpeg,.png,.webp" multiple style="display:none;" onchange="handlePdfFileUpload(event)">
                <div id="attached-pdfs-container" style="display:inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;"></div>
            </div>
        </div>

        <!-- STRANKA -->
        <div class="header-group" style="grid-column: span 3; position: relative;">
            <label for="calc-customer">Stranka</label>
            <div style="display: flex; gap: 0.2rem; position: relative;">
                <input type="text" id="calc-customer" autocomplete="off" placeholder="Izberite stranko" style="flex: 1;"
                    value="KRKA, d.d., Novo mesto" oninput="updateWorkOrderLive()">
                <button onclick="toggleCustomerDropdown()" type="button"
                    style="width: 35px; background: #3b82f6; border: none; border-radius: 8px; color: white; cursor: pointer;">▼</button>
                <div id="cust-dropdown-list"
                    style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 5px;">
                </div>
            </div>
        </div>

        <!-- PRIPOMBE / POSEBNOSTI -->
        <div class="header-group" style="grid-column: span 3;">
            <label for="calc-notes">Pripombe / posebnosti</label>
            <textarea id="calc-notes" placeholder="Vnesite posebnosti ali pripombe..." rows="3"
                oninput="updateWorkOrderLive()"></textarea>
        </div>

        <!-- STOLPEC 1: PONUDBA, ŠIFRA, PAKIRANJE -->
        <div class="header-group" style="grid-column: span 1; display: flex; flex-direction: column; gap: 0.5rem;">
            <div>
                <label for="calc-quote-number">Številka ponudbe</label>
                <input type="text" id="calc-quote-number" placeholder="Št. ponudbe" value="" oninput="updateWorkOrderLive()">
            </div>
            <div>
                <label for="calc-customer-code">Šifra stranke</label>
                <input type="text" id="calc-customer-code" placeholder="Šifra stranke" value="2892" oninput="updateWorkOrderLive()">
            </div>
            <div>
                <label for="calc-product-code">Šifra izdelka</label>
                <input type="text" id="calc-product-code" placeholder="Šifra izdelka (PhC)..." value="" oninput="updateWorkOrderLive()">
            </div>
            <div>
                <label for="calc-dn-packaging">Pakiranje (D.N.)</label>
                <input type="text" id="calc-dn-packaging" placeholder="Pakiranje..." value="" oninput="updateWorkOrderLive()">
            </div>
        </div>

        <!-- STOLPEC 2: ŠT. DN, STARI DN, ROK, NUJNO -->
        <div class="header-group" style="grid-column: span 1; display: flex; flex-direction: column; gap: 0.5rem;">
            <div>
                <label for="calc-dn-number">Številka D.N.</label>
                <input type="text" id="calc-dn-number" placeholder="Št. delovnega naloga" value="" oninput="updateWorkOrderLive()">
            </div>
            <div>
                <label for="calc-dn-old">Stari D.N. (za montažo)</label>
                <input type="text" id="calc-dn-old" placeholder="Stari D.N." value="" oninput="updateWorkOrderLive()">
            </div>
            <div>
                <label for="calc-dn-deadline">Rok izdelave</label>
                <input type="text" id="calc-dn-deadline" placeholder="Rok izdelave..." value="" oninput="updateWorkOrderLive()">
            </div>
            <div style="display:flex; align-items:center; gap: 0.5rem; margin-top: 5px;">
                <input type="checkbox" id="calc-dn-urgent" onchange="updateWorkOrderLive()" style="width:auto; height:auto;">
                <label for="calc-dn-urgent" style="color: #ef4444; font-weight: bold; margin:0;">NUJNO! (OBVEZNO NA TA DATUM!)</label>
            </div>
        </div>

        <!-- STOLPEC 3: PRIPRAVIL, TIP NAROČILA, PREDOGLED -->
        <div class="header-group" style="grid-column: span 1;">
            <div>
                <label for="calc-prepared-by">Ponudbo pripravil</label>
                <select id="calc-prepared-by">
                    <option value="Darko Sužnik" selected>Darko Sužnik</option>
                    <option value="Sašo Slemenšek">Sašo Slemenšek</option>
                    <option value="Tilen Petrič">Tilen Petrič</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <label for="calc-order-type">Tip naročila</label>
                <select id="calc-order-type" onchange="updateWorkOrderLive()">
                    <option value="Ponatis" selected>Ponatis</option>
                    <option value="NOVO">NOVO</option>
                    <option value="NOVO AK-JPG Montaže">NOVO AK-JPG Montaže</option>
                    <option value="Sprememba">Sprememba</option>
                    <option value="Sprememba AK-JPG Montaže">Sprememba AK-JPG Montaže</option>
                    <option value="Ponatis AK-JPG Montaže">Ponatis AK-JPG Montaže</option>
                </select>
            </div>
            <!-- Predogled kartic -->
            <div id="custom-docs-preview" style="display: flex; gap: 10px; margin-top: 10px; justify-content: center;">
                <div onclick="printKrkaWorkOrder()" style="width: 70px; height: 90px; border: 2px solid #8b5cf6; background: rgba(139, 92, 246, 0.15); border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;" title="Klikni za tisk naloga">
                    <span style="font-size: 20px;">📋</span>
                    <span style="font-size: 9px; font-weight: bold; color: #a78bfa;">D. NALOG</span>
                </div>
            </div>
        </div>

        <!-- NASLOV IN E-MAIL VRSTICA -->
        <div class="header-group" style="grid-column: span 6; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 10px; border: 1px dashed var(--glass-border);">
            <div class="header-group">
                <label for="calc-cust-address">Naslov stranke</label>
                <textarea id="calc-cust-address" placeholder="Ulica in kraj" rows="2" oninput="updateWorkOrderLive()">Šmarješka cesta 6, 8501 Novo mesto</textarea>
            </div>
            <div class="header-group">
                <label for="calc-delivery-address">Naslov za dostavo</label>
                <textarea id="calc-delivery-address" placeholder="" rows="2" oninput="updateWorkOrderLive()">Krka Novo mesto: Skladišče embalaže!</textarea>
            </div>
            <div class="header-group" style="grid-column: span 2;">
                <label for="calc-cust-email">E-mail stranke</label>
                <input type="text" id="calc-cust-email" value="stanka.hudak@krka.biz; brigita.kermc-jeric@krka.biz">
            </div>
        </div>
    </div>

    <!-- MAIN 2-COLUMN VIEW -->
    <div class="main-layout">
        <!-- LEVI STOLPEC: VNOS PODATKOV ZA KRKO -->
        <div class="left-column">
            
            <!-- PANEL 1: FORMAT IN NAKLADA -->
            <div class="panel">
                <div class="section-header">
                    <div class="section-title">📦 1. Format izdelka & Količina</div>
                    <span style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">KRKA CENIK 28.7.2026</span>
                </div>

                <div class="header-group" style="margin-bottom: 0.75rem;">
                    <label for="krka-format-select" style="color: #60a5fa; font-weight: 700;">Izberite format iz cenika (spustni seznam):</label>
                    <select id="krka-format-select" onchange="onKrkaFormatSelected()" style="font-weight: bold; border: 1.5px solid #3b82f6;">
                        <!-- Populate dynamically from cenik -->
                    </select>
                </div>

                <div class="grid-2" style="margin-bottom: 0.75rem;">
                    <div class="header-group">
                        <label for="krka-dim-o">Odprt format (mm)</label>
                        <input type="text" id="krka-dim-o" placeholder="Odprt format (mm)" value="" oninput="updateWorkOrderLive(); calculateKrkaPrice();">
                    </div>
                    <div class="header-group">
                        <label for="krka-dim-z">Zgiban format (mm)</label>
                        <input type="text" id="krka-dim-z" placeholder="Zgiban format (mm)" value="" oninput="updateWorkOrderLive();">
                    </div>
                </div>

                <div class="grid-3" style="margin-bottom: 0.75rem;">
                    <div class="header-group">
                        <label for="krka-quantity" style="color: #4ade80; font-weight: 700;">Količina (kos)</label>
                        <input type="text" id="krka-quantity" placeholder="Vnesite količino" value="" oninput="onQuantityChanged()" onblur="formatQuantityInput()" onkeydown="if(event.key==='Enter') formatQuantityInput();">

        // 3. Posodobi število plošč za tisk (f + b)

        sv('krka-plates-count', `${totalTiskPlates} kom. ${machine}`);

        // 4. Izračunaj ceno po ceniku in osveži delovni nalog
        calculateKrkaPrice();
        updateWorkOrderLive();
    }

    // Initialize Format Dropdown
    function initFormatDropdown() {
        const select = document.getElementById('krka-format-select');
        select.innerHTML = '';

        // Placeholder first option
        const placeholderOpt = document.createElement('option');
        placeholderOpt.value = '';
        placeholderOpt.textContent = '— Izberite format iz cenika —';
        placeholderOpt.disabled = true;
        placeholderOpt.selected = true;
        select.appendChild(placeholderOpt);

        // Extract unique dimension pairs
        const uniqueDims = [];
        const seen = new Set();
        KRKA_CENIK_DATA.forEach(item => {
            const key = item.dimO + '|' + item.dimZ;
            if (!seen.has(key)) {
                seen.add(key);
                uniqueDims.push({ dimO: item.dimO, dimZ: item.dimZ });
            }
        });

        uniqueDims.forEach((dim, idx) => {
            const opt = document.createElement('option');
            opt.value = dim.dimO + '|' + dim.dimZ;
            opt.textContent = `${dim.dimO} mm (zgiban ${dim.dimZ} mm)`;
            select.appendChild(opt);
        });

        // Add custom option
        const customOpt = document.createElement('option');
        customOpt.value = 'custom';
        customOpt.textContent = '✏️ Po meri (ročni vnos)';
        select.appendChild(customOpt);

            sv('krka-dim-z', parts[1] + ' mm');

    function parseNumericQty(str) {
        if (!str) return 0;
        const cleaned = str.toString().replace(/\s+/g, '').replace(/[.,]/g, '');
        const val = parseInt(cleaned, 10);
        return isNaN(val) ? 0 : val;
    }

    function formatNumberSlo(num) {
        return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Format quantity input with thousand separator dot
    function formatQuantityInput() {
        const raw = gv('krka-quantity');
        if (!raw.trim()) return;
        const num = parseNumericQty(raw);
        if (num > 0) {
            sv('krka-quantity', formatNumberSlo(num));
        }
        onQuantityChanged();
    }

    function recalculateBanding() {
        const qty = parseNumericQty(gv('krka-quantity'));
        const bandSize = parseInt(gv('krka-band-size')) || 20;
        if (qty > 0 && bandSize > 0) {
            const totalBands = Math.ceil(qty / bandSize);
            sv('krka-bands-count', formatNumberSlo(totalBands) + ' kos');
        } else {
            sv('krka-bands-count', '');
        }
    }

    function recalculateBoxes() {
        const qty = parseNumericQty(gv('krka-quantity'));
        const bandSize = parseInt(gv('krka-band-size')) || 20;
        const samples = parseInt(gv('krka-samples-count')) || 80;
        const cap = parseInt(gv('krka-box-cap')) || 3000;

        if (qty <= 0 || cap <= 0) {
            sv('krka-boxes-calc', '');
            sv('krka-boxes-total', '');
            return;
        }

        // Vzorci so všteti ali ločeni
        const netForBoxes = Math.max(0, qty - samples);
        const fullBoxes = Math.floor(netForBoxes / cap);
        const remainder = netForBoxes % cap;

        let parts = [];
        let totalBoxes = fullBoxes;

        if (fullBoxes > 0) {
            parts.push(`${fullBoxes}x ${formatNumberSlo(cap)} kos`);
        }
        if (remainder > 0) {
            parts.push(`1x ${formatNumberSlo(remainder)} kos`);
            totalBoxes += 1;
        }
        if (samples > 0) {
            parts.push(`1x Vzorci ${samples} kos`);
            totalBoxes += 1;
        }

        const boxesCalcStr = `ovoj po ${bandSize} kom.; v škatle po ${parts.join(', ')}`;
        sv('krka-boxes-calc', boxesCalcStr);
        sv('krka-boxes-total', totalBoxes + ' kom.');
    }

    function recalculateSheets() {
        const qty = parseNumericQty(gv('krka-quantity'));
        if (qty <= 0) {
            sv('krka-print-run', '');
            sv('krka-cut-sheets', '');
            sv('krka-raw-sheets', '');
            return;
        }
        const itemsMatch = (gv('krka-items-per-sheet') || '4').match(/(\d+)/);
        const itemsPerSheet = (itemsMatch && parseInt(itemsMatch[1]) > 0) ? parseInt(itemsMatch[1]) : 1;
        const netSheets = Math.ceil(qty / itemsPerSheet);
        let waste = Math.max(500, Math.round(netSheets * 0.04));
        waste = Math.round(waste / 50) * 50;
        const totalCutSheets = netSheets + waste;
        const rawB1 = Math.ceil(totalCutSheets / 2);

        sv('krka-print-run', `${formatNumberSlo(netSheets)} + ${formatNumberSlo(waste)} = ${formatNumberSlo(totalCutSheets)} tisk. pol (1x skozi stroj)`);
        sv('krka-cut-sheets', `${formatNumberSlo(totalCutSheets)} pol na 69,8 x 49,8 cm (2 iz pole)`);
        sv('krka-raw-sheets', `${formatNumberSlo(rawB1)} pol B1 SB`);
    }

    // Calculate Krka Cenik price
    function calculateKrkaPrice() {
        const dimOInput = gv('krka-dim-o').replace(/\s*mm/gi, '').trim();
        const colors = parseInt(gv('krka-colors-count')) || 4;
        const bandSize = gv('krka-band-size') || '20';
        const qty = parseNumericQty(gv('krka-quantity'));

        // Match cenik item
        // Try exact match or cleaned match (e.g. 398x148)
        const cleanDimO = dimOInput.replace(/\s+/g, '').toLowerCase();

        if (!cleanDimO || qty <= 0) {
            document.getElementById('label-fix-price').textContent = '- €';
            document.getElementById('label-var-price').textContent = '- €';
            sv('krka-price-unit', '');
            sv('krka-price-total', '');
            sv('krka-footer-cenik-row', '');
            return;
        }

        let matched = KRKA_CENIK_DATA.find(item => {
            const itemO = item.dimO.replace(/\s+/g, '').toLowerCase();
            return itemO === cleanDimO && item.barve === colors;
        });

        // Fallback without colors if not matched
        if (!matched) {
            matched = KRKA_CENIK_DATA.find(item => {
                const itemO = item.dimO.replace(/\s+/g, '').toLowerCase();
                return itemO === cleanDimO;
            });
        }

        if (matched) {
            const fix = matched.fix || 0;
            const varPrice = matched.var[bandSize] || matched.var['20'] || Object.values(matched.var)[0] || 0;

            document.getElementById('label-fix-price').textContent = fix.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('label-var-price').textContent = varPrice.toFixed(4).replace('.', ',') + ' €';

            // Formula: Cena na 100 kos = FIX / (naklada / 100) + VAR
            const units100 = qty / 100;
            const unitPrice = (fix / units100) + varPrice;
            const totalPrice = unitPrice * units100;

            const unitPriceStr = unitPrice.toFixed(2).replace('.', ',') + ' €/ 100 kos';
            const totalPriceStr = totalPrice.toLocaleString('sl-SI', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

            sv('krka-price-unit', unitPriceStr);
            sv('krka-price-total', totalPriceStr);

            // Footer cenik line
            const f = gv('krka-colors-front') !== '' ? gv('krka-colors-front') : '4';
            const b = gv('krka-colors-back') !== '' ? gv('krka-colors-back') : '1';
            const footerLine = `Cenik 2026:     ${cleanDimO}mm    ${f}${b}b    ${formatNumberSlo(qty)} kos    ${unitPriceStr}`;
            sv('krka-footer-cenik-row', footerLine);
        } else {
            document.getElementById('label-fix-price').textContent = '- €';
            document.getElementById('label-var-price').textContent = '- €';
            sv('krka-price-unit', '');
            sv('krka-price-total', '');
            sv('krka-footer-cenik-row', '');
        }
    }

    function resetWorkOrderToDefault() {

    // Export to Word Document (.doc)
    function exportKrkaWordDoc() {
        const sheetHtml = document.getElementById('krka-work-order-sheet').innerHTML;
        const dn = (gv('calc-dn-number') || 'KRKA').replace(/[/\\?%*:|"<> \t]/g, '_');
        const filename = `DN_KRKA_${dn}.doc`;

        const fullHtml = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>Delovni Nalog KRKA</title>
            <style>
                body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.3; }
                .dn-sep-double { border-bottom: 2px solid #000; margin: 6px 0; }
                .dn-sep-single { border-bottom: 1px solid #000; margin: 5px 0; }
                .badge-yellow { background-color: #ffff00; font-weight: bold; }
                .badge-gray { background-color: #e5e7eb; font-weight: bold; }
                .badge-warning-box { background-color: #ffff00; text-align: center; font-weight: bold; padding: 4px; border: 1px dashed #000; }
            </style>
            </head>
            <body>${sheetHtml}</body></html>
        `;

        const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function saveProjectToServer(projectData) {
        try {
            const res = await fetch('http://127.0.0.1:8095/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(projectData)
            });
            if (res.ok) console.log("Shranjeno na lokalni strežnik.");
        } catch(e) {
            console.log("Strežnik ni dosegljiv, shranjeno samo v brskalnik.");
        }
    }

    // Load Project Snapshot
    function loadKrkaProject(proj) {
        if (!proj || !proj.inputs) return;
        const inp = proj.inputs;

        sv('calc-project-name', proj.name || '');
        sv('calc-customer', proj.customer || 'KRKA, d.d., Novo mesto');
        sv('calc-quote-number', proj.quoteNum || '');
        sv('calc-dn-number', proj.dnNumber || '');
        sv('calc-dn-deadline', proj.deadline || '');
        if (document.getElementById('calc-dn-urgent')) {
            document.getElementById('calc-dn-urgent').checked = !!proj.urgent;
        }

        // Inputs
        if (inp.formatSelect) sv('krka-format-select', inp.formatSelect);
        if (inp.dimO) sv('krka-dim-o', inp.dimO);
        if (inp.dimZ) sv('krka-dim-z', inp.dimZ);
        if (inp.quantity) sv('krka-quantity', inp.quantity);
        if (inp.orderNum) sv('krka-order-num', inp.orderNum);
        if (inp.dnDate) sv('krka-dn-date', inp.dnDate);
        if (inp.colorsFront !== undefined && inp.colorsFront !== '') {
            sv('krka-colors-front', inp.colorsFront);
        } else if (inp.printDesc) {
            const match = inp.printDesc.match(/^(\d+)\s*\/\s*(\d+)/);
            if (match) sv('krka-colors-front', match[1]);
        }
        if (inp.colorsBack !== undefined && inp.colorsBack !== '') {
            sv('krka-colors-back', inp.colorsBack);
        } else if (inp.printDesc) {
            const match = inp.printDesc.match(/^(\d+)\s*\/\s*(\d+)/);
            if (match) sv('krka-colors-back', match[2]);
        }
        if (inp.colorsCount) sv('krka-colors-count', inp.colorsCount);
        if (inp.printDesc) sv('krka-print-desc', inp.printDesc);
        if (inp.varnishDesc) sv('krka-varnish-desc', inp.varnishDesc);
        if (inp.machine) sv('krka-machine', inp.machine);
        if (inp.prepHours) sv('krka-prep-hours', inp.prepHours);
        if (inp.printRun) sv('krka-print-run', inp.printRun);
        if (inp.printHours) sv('krka-print-hours', inp.printHours);
        if (inp.platesCount) sv('krka-plates-count', inp.platesCount);
        if (inp.platesVarnish) sv('krka-plates-varnish', inp.platesVarnish);
        if (inp.itemsPerSheet) sv('krka-items-per-sheet', inp.itemsPerSheet);
        if (inp.matDesc) sv('krka-material-desc', inp.matDesc);
        if (inp.matStock) sv('krka-material-stock', inp.matStock);
        if (inp.matCode) sv('krka-material-code', inp.matCode);
        if (inp.rawSheets) sv('krka-raw-sheets', inp.rawSheets);
        if (inp.cutSheets) sv('krka-cut-sheets', inp.cutSheets);
        if (inp.finishingDesc) sv('krka-finishing-desc', inp.finishingDesc);
        if (inp.bandSize) sv('krka-band-size', inp.bandSize);
        if (inp.bandsCount) sv('krka-bands-count', inp.bandsCount);
        if (inp.samplesCount) sv('krka-samples-count', inp.samplesCount);
        if (inp.boxCap) sv('krka-box-cap', inp.boxCap);
        if (inp.boxDim) sv('krka-box-dim', inp.boxDim);
        if (inp.boxesCalc) sv('krka-boxes-calc', inp.boxesCalc);
        if (inp.boxesTotal) sv('krka-boxes-total', inp.boxesTotal);
        if (inp.samplesText) sv('krka-samples-text', inp.samplesText);
        if (inp.priceUnit) sv('krka-price-unit', inp.priceUnit);
        if (inp.priceTotal) sv('krka-price-total', inp.priceTotal);
        if (inp.footerCenikRow) sv('krka-footer-cenik-row', inp.footerCenikRow);

        if (inp.notes) sv('calc-notes', inp.notes);
        if (inp.customerCode) sv('calc-customer-code', inp.customerCode);
        if (inp.productCode) sv('calc-product-code', inp.productCode);
        if (inp.packaging) sv('calc-dn-packaging', inp.packaging);
        if (inp.oldDn) sv('calc-dn-old', inp.oldDn);
        if (inp.preparedBy) sv('calc-prepared-by', inp.preparedBy);

        if (inp.custAddress) sv('calc-cust-address', inp.custAddress);
        if (inp.deliveryAddress) sv('calc-delivery-address', inp.deliveryAddress);

        g_isUserDirectEditing = false;

    // Projects list and dropdown
    function toggleProjectsDropdown(forceState) {
        const drop = document.getElementById('projects-dropdown-list');
        if (!drop) return;
        const isShow = (forceState !== undefined) ? forceState : (drop.style.display !== 'flex');
        drop.style.display = isShow ? 'flex' : 'none';
        if (isShow) {
            renderSavedProjects();
            setTimeout(() => document.getElementById('project-search-input')?.focus(), 100);
        }
    }

    function setProjectFilterMode(mode) {
        g_projectFilterMode = mode;
        const btnAll = document.getElementById('btn-filter-all');
        const btnType = document.getElementById('btn-filter-type');
        if (mode === 'all') {
            btnAll.style.background = '#3b82f6';
            btnAll.style.color = 'white';
            btnType.style.background = '#334155';
            btnType.style.color = '#94a3b8';
        } else {
            btnType.style.background = '#3b82f6';
            btnType.style.color = 'white';
            btnAll.style.background = '#334155';
            btnAll.style.color = '#94a3b8';
        }
        renderSavedProjects();
    }

    async function fetchServerProjects() {
        try {
            const res = await fetch('http://127.0.0.1:8095/list');
            if (res.ok) {
                const data = await res.json();
                if (data.status === 'success' && Array.isArray(data.projects)) {
                    g_serverProjects = data.projects;
                }
            }
        } catch(e) {
            if (window.__SERVER_PROJECTS_INDEX && Array.isArray(window.__SERVER_PROJECTS_INDEX)) {
                g_serverProjects = window.__SERVER_PROJECTS_INDEX;
            }
        }
    }

    function renderSavedProjects() {
        const listDiv = document.getElementById('projects-list-content');
        if (!listDiv) return;
        const q = (gv('project-search-input') || '').trim().toLowerCase();

        // Local storage archive
        const localArhiv = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const allProjects = [...localArhiv, ...g_serverProjects];

        // Update counts
        const countAllEl = document.getElementById('count-filter-all');
        const countTypeEl = document.getElementById('count-filter-type');
        if (countAllEl) countAllEl.textContent = allProjects.length;

        const krkaOnly = allProjects.filter(p => {
            const src = (p._source || p.source || '').toLowerCase();
            const cust = (p.customer || '').toLowerCase();
            const name = (p.name || '').toLowerCase();
            return src.includes('krka') || cust.includes('krka') || name.includes('krka');
        });
        if (countTypeEl) countTypeEl.textContent = krkaOnly.length;

        const listToDisplay = (g_projectFilterMode === 'type') ? krkaOnly : allProjects;
        const filtered = listToDisplay.filter(p => {
            if (!q) return true;
            const fullStr = `${p.name || ''} ${p.customer || ''} ${p.quoteNum || ''} ${p.dnNumber || ''}`.toLowerCase();
            return fullStr.includes(q);
        });

        listDiv.innerHTML = '';
        if (filtered.length === 0) {
            listDiv.innerHTML = '<div style="padding: 15px; color: #94a3b8; font-size: 0.8rem; text-align: center;">Ni shranjenih projektov</div>';
            return;
        }

        filtered.slice(0, 50).forEach(p => {
            const item = document.createElement('div');
            item.style.padding = '8px 12px';
            item.style.borderBottom = '1px solid #334155';
            item.style.cursor = 'pointer';
            item.style.transition = 'background 0.2s';
            item.onmouseover = () => item.style.background = '#334155';
            item.onmouseout = () => item.style.background = 'transparent';

            item.innerHTML = `
                <div style="font-weight: bold; color: #f8fafc; font-size: 0.85rem;">${p.name || 'Brez imena'}</div>
                <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">
                    <span>${p.customer || 'KRKA'}</span>
                    <span>${p.date || ''}</span>
                </div>
            `;
            item.onclick = () => loadKrkaProject(p);
            listDiv.appendChild(item);
        });
    }

    // Customer Dropdown
    function toggleCustomerDropdown() {
        const list = document.getElementById('cust-dropdown-list');
        if (!list) return;
        const isShow = list.style.display !== 'block';
        list.style.display = isShow ? 'block' : 'none';
        if (isShow) renderCustomerList('');
    }

    function renderCustomerList(filter) {
        const listDiv = document.getElementById('cust-dropdown-list');
        if (!listDiv) return;
        listDiv.innerHTML = '';

        let customers = ['KRKA, d.d., Novo mesto'];
        if (window.PETRIC_CONTACTS_SEED) {
            Object.values(window.PETRIC_CONTACTS_SEED).forEach(c => {
                if (c && c.name && !customers.includes(c.name)) customers.push(c.name);
            });
        }

        const q = (filter || '').toLowerCase();
        customers.filter(c => !q || c.toLowerCase().includes(q)).slice(0, 20).forEach(c => {
            const d = document.createElement('div');
            d.style.padding = '8px 12px';
            d.style.color = '#ffffff';
            d.style.cursor = 'pointer';
            d.style.fontSize = '0.82rem';
            d.textContent = c;
            d.onmouseover = () => d.style.background = '#334155';
            d.onmouseout = () => d.style.background = 'transparent';
            d.onclick = () => {
                sv('calc-customer', c);
                listDiv.style.display = 'none';
                updateWorkOrderLive();
            };
            listDiv.appendChild(d);
        });
    }

    // Email Modal
    function openEmailModal() {
        const m = document.getElementById('email-modal-overlay');
        if (m) m.style.display = 'flex';
    }

    function closeEmailModal() {
        const m = document.getElementById('email-modal-overlay');
        if (m) m.style.display = 'none';
    }

    function saveEmailModalData() {
        const content = gv('calc-email-content');
        if (content.trim()) {
            document.getElementById('attached-email-badge').style.display = 'inline-flex';
            document.getElementById('attached-email-summary').textContent = `${content.length} znakov`;
        }
        closeEmailModal();
    }

    function removeAttachedEmail() {
        sv('calc-email-content', '');
        document.getElementById('attached-email-badge').style.display = 'none';
    }

    function handlePdfFileUpload(e) {
        const files = e.target.files;
        if (!files || !files.length) return;
        const cont = document.getElementById('attached-pdfs-container');
        Array.from(files).forEach(f => {
            const badge = document.createElement('div');
            badge.style.cssText = 'background: rgba(236, 72, 153, 0.2); border: 1px solid #ec4899; color: #f472b6; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 4px;';
            badge.innerHTML = `<span>📎 ${f.name}</span><span style="cursor:pointer; font-weight:bold;" onclick="this.parentElement.remove()">✕</span>`;
            cont.appendChild(badge);
        });
    }

    // Global click listener to close dropdowns
    document.addEventListener('click', (e) => {
        const projDrop = document.getElementById('projects-dropdown-list');
        if (projDrop && projDrop.style.display === 'flex') {
            if (!e.target.closest('#projects-dropdown-list') && !e.target.closest('#btn-my-projects')) {
                projDrop.style.display = 'none';
            }
        }
        const custDrop = document.getElementById('cust-dropdown-list');
        if (custDrop && custDrop.style.display === 'block') {
            if (!e.target.closest('#cust-dropdown-list') && !e.target.closest('button[onclick*="toggleCustomerDropdown"]') && !e.target.closest('#calc-customer')) {
                custDrop.style.display = 'none';
            }
        }
    });

    // Initial setup on load
    window.addEventListener('DOMContentLoaded', () => {
        initFormatDropdown();
        recalculateBanding();
        recalculateBoxes();
        calculateKrkaPrice();
        updateWorkOrderLive();
        fetchServerProjects().then(() => renderSavedProjects()).catch(()=>{});
    });
</script>
