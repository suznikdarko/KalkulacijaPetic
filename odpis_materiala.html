<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odpis Materiala iz Zaloge</title>
    <!-- JSZip za neposredno urejanje XML znotraj .xlsx (ohrani vso formatiranje/tabele) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --input-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-file {
            width: 100%;
            text-align: center;
            background: var(--input-bg);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            color: #94a3b8;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            box-sizing: border-box;
        }

        .btn-file:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .btn-submit:active { transform: translateY(0); }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .file-name-display {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--success);
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Odpis Materiala (Excel)</h1>

        <div class="form-group">
            <label>Izberite datoteko (.xlsx)</label>
            <button id="btnPickFile" class="btn-file">📁 Kliknite za izbiro datoteke</button>
            <div id="selectedFileName" class="file-name-display"></div>
        </div>

        <div class="form-group">
            <label for="materialCode">Šifra materiala (npr. PAP-135-MAT)</label>
            <input type="text" id="materialCode" placeholder="Vnesite šifro...">
        </div>

        <div class="form-group">
            <label for="quantity">Količina za odpis (koliko pol se odšteje)</label>
            <input type="number" id="quantity" placeholder="npr. 500" min="0" step="any">
        </div>

        <button class="btn-submit" id="processBtn">Odpiši in prenesi datoteko</button>

        <div id="status"></div>
    </div>

    <script>
        let selectedFileHandle = null;
        let selectedFile = null;

        const XML_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
        const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

        document.getElementById('btnPickFile').addEventListener('click', async function () {
            try {
                if (typeof window.showOpenFilePicker !== 'function') {
                    showStatus('Vaš brskalnik ne podpira avtomatskega shranjevanja datotek (priporočamo Chrome ali Edge).', 'error');
                    return;
                }
                const [handle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'Excel Files',
                        accept: {
                            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'],
                            'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm']
                        }
                    }],
                    multiple: false
                });
                selectedFileHandle = handle;
                selectedFile = await handle.getFile();

                const btn = document.getElementById('btnPickFile');
                btn.style.borderColor = '#10b981';
                btn.style.color = '#10b981';
                document.getElementById('selectedFileName').innerText = "Izbrana datoteka: " + selectedFile.name;
                document.getElementById('status').style.display = 'none';
            } catch (err) {
                if (err.name !== 'AbortError') {
                    showStatus('Napaka pri izbiri datoteke: ' + err.message, 'error');
                }
            }
        });

        // ---- Pomožne funkcije za delo s celicami (npr. "C5" -> {col: 3, row: 5}) ----

        function splitCellRef(ref) {
            const m = ref.match(/^([A-Z]+)(\d+)$/);
            return { colLetters: m[1], row: parseInt(m[2], 10) };
        }

        function colLettersToIndex(letters) {
            let idx = 0;
            for (let i = 0; i < letters.length; i++) {
                idx = idx * 26 + (letters.charCodeAt(i) - 64);
            }
            return idx; // 1-based
        }

        function colIndexToLetters(idx) {
            let letters = '';
            while (idx > 0) {
                const rem = (idx - 1) % 26;
                letters = String.fromCharCode(65 + rem) + letters;
                idx = Math.floor((idx - 1) / 26);
            }
            return letters;
        }

        async function getSharedStrings(zip) {
            const f = zip.file('xl/sharedStrings.xml');
            if (!f) return [];
            const xmlText = await f.async('text');
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            const siList = doc.getElementsByTagNameNS(XML_NS, 'si');
            const strings = [];
            for (let i = 0; i < siList.length; i++) {
                const tNodes = siList[i].getElementsByTagNameNS(XML_NS, 't');
                let text = '';
                for (let j = 0; j < tNodes.length; j++) text += tNodes[j].textContent;
                strings.push(text);
            }
            return strings;
        }

        function getCellText(cellEl, sharedStrings) {
            if (!cellEl) return null;
            const type = cellEl.getAttribute('t');
            if (type === 'inlineStr') {
                const isEl = cellEl.getElementsByTagNameNS(XML_NS, 'is')[0];
                if (!isEl) return null;
                const tEl = isEl.getElementsByTagNameNS(XML_NS, 't')[0];
                return tEl ? tEl.textContent : null;
            }
            const vEl = cellEl.getElementsByTagNameNS(XML_NS, 'v')[0];
            if (!vEl) return null;
            if (type === 's') {
                const idx = parseInt(vEl.textContent, 10);
                return sharedStrings[idx] !== undefined ? sharedStrings[idx] : null;
            }
            return vEl.textContent;
        }

        async function getFirstSheetPath(zip) {
            const workbookXml = await zip.file('xl/workbook.xml').async('text');
            const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('text');
            const wbDoc = new DOMParser().parseFromString(workbookXml, 'application/xml');
            const relsDoc = new DOMParser().parseFromString(relsXml, 'application/xml');

            const sheetEl = wbDoc.getElementsByTagNameNS(XML_NS, 'sheet')[0];
            let rId = sheetEl.getAttributeNS(REL_NS, 'id');
            if (!rId) rId = sheetEl.getAttribute('r:id');

            const rels = relsDoc.getElementsByTagName('Relationship');
            let target = null;
            for (let i = 0; i < rels.length; i++) {
                if (rels[i].getAttribute('Id') === rId) {
                    target = rels[i].getAttribute('Target');
                    break;
                }
            }
            if (!target) throw new Error('Ne najdem poti do delovnega lista v workbook.xml.rels');
            target = target.replace(/^\//, '');
            if (!target.startsWith('xl/')) target = 'xl/' + target;
            return target;
        }

        document.getElementById('processBtn').addEventListener('click', async function () {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'none';

            const materialCode = document.getElementById('materialCode').value.trim();
            const quantityVal = parseFloat(document.getElementById('quantity').value);

            if (!selectedFile) { showStatus('Prosim, izberite Excel (.xlsx) datoteko.', 'error'); return; }
            if (!materialCode) { showStatus('Prosim, vnesite šifro materiala.', 'error'); return; }
            if (isNaN(quantityVal) || quantityVal <= 0) {
                showStatus('Količina mora biti veljavno pozitivno število večje od 0.', 'error');
                return;
            }

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);

                const sheetPath = await getFirstSheetPath(zip);
                const sheetXmlText = await zip.file(sheetPath).async('text');
                const sharedStrings = await getSharedStrings(zip);

                const doc = new DOMParser().parseFromString(sheetXmlText, 'application/xml');
                const rows = doc.getElementsByTagNameNS(XML_NS, 'row');

                if (rows.length === 0) throw new Error('List je videti prazen.');

                // --- Najdi stolpca "šifra" in "zaloga" v prvi vrstici ---
                const headerRow = rows[0];
                const headerCells = headerRow.getElementsByTagNameNS(XML_NS, 'c');

                let sifraColIdx = -1;
                let zalogaColIdx = -1;
                let maxColIdx = 0;

                for (let i = 0; i < headerCells.length; i++) {
                    const ref = headerCells[i].getAttribute('r');
                    const { colLetters } = splitCellRef(ref);
                    const colIdx = colLettersToIndex(colLetters);
                    maxColIdx = Math.max(maxColIdx, colIdx);

                    const text = getCellText(headerCells[i], sharedStrings);
                    if (!text) continue;
                    const val = text.toLowerCase();
                    if (val.includes('šifra') || val.includes('sifra')) sifraColIdx = colIdx;
                    if (val.includes('zaloga') || val.includes('količina') || val.includes('kolicina')) zalogaColIdx = colIdx;
                }

                if (sifraColIdx === -1) {
                    throw new Error('V prvi vrstici tabele ne najdem stolpca, ki bi vseboval besedo "šifra".');
                }

                // Če stolpca "zaloga" ni, ga dodamo na konec (opozorilo: nov stolpec ne bo imel obstoječega stila)
                let addedNewColumn = false;
                if (zalogaColIdx === -1) {
                    zalogaColIdx = maxColIdx + 1;
                    addedNewColumn = true;
                    const headerRef = colIndexToLetters(zalogaColIdx) + '1';
                    const newHeaderCell = doc.createElementNS(XML_NS, 'c');
                    newHeaderCell.setAttribute('r', headerRef);
                    newHeaderCell.setAttribute('t', 'inlineStr');
                    const isEl = doc.createElementNS(XML_NS, 'is');
                    const tEl = doc.createElementNS(XML_NS, 't');
                    tEl.textContent = 'Zaloga';
                    isEl.appendChild(tEl);
                    newHeaderCell.appendChild(isEl);
                    insertCellInOrder(headerRow, newHeaderCell, zalogaColIdx);
                }

                // --- Poišči vrstico z ujemajočo šifro ---
                let found = false;
                let initialZaloga = 0;
                let newZaloga = 0;

                for (let r = 1; r < rows.length; r++) {
                    const row = rows[r];
                    const cells = row.getElementsByTagNameNS(XML_NS, 'c');
                    let sifraCell = null;
                    for (let i = 0; i < cells.length; i++) {
                        const { colLetters } = splitCellRef(cells[i].getAttribute('r'));
                        if (colLettersToIndex(colLetters) === sifraColIdx) { sifraCell = cells[i]; break; }
                    }
                    if (!sifraCell) continue;

                    const currentCode = (getCellText(sifraCell, sharedStrings) || '').trim();
                    if (currentCode.toLowerCase() !== materialCode.toLowerCase()) continue;

                    found = true;
                    const rowNum = parseInt(row.getAttribute('r'), 10);
                    const zalogaRef = colIndexToLetters(zalogaColIdx) + rowNum;

                    let zalogaCell = null;
                    for (let i = 0; i < cells.length; i++) {
                        const { colLetters } = splitCellRef(cells[i].getAttribute('r'));
                        if (colLettersToIndex(colLetters) === zalogaColIdx) { zalogaCell = cells[i]; break; }
                    }

                    if (!zalogaCell) {
                        zalogaCell = doc.createElementNS(XML_NS, 'c');
                        zalogaCell.setAttribute('r', zalogaRef);
                        insertCellInOrder(row, zalogaCell, zalogaColIdx);
                        initialZaloga = 0;
                    } else {
                        const text = getCellText(zalogaCell, sharedStrings);
                        initialZaloga = parseFloat(text);
                        if (isNaN(initialZaloga)) initialZaloga = 0;
                    }

                    newZaloga = initialZaloga - quantityVal;

                    // Odstranimo morebiten string-tip / inline vsebino, zapišemo številko
                    zalogaCell.removeAttribute('t');
                    const existingIs = zalogaCell.getElementsByTagNameNS(XML_NS, 'is')[0];
                    if (existingIs) zalogaCell.removeChild(existingIs);
                    let vEl = zalogaCell.getElementsByTagNameNS(XML_NS, 'v')[0];
                    if (!vEl) {
                        vEl = doc.createElementNS(XML_NS, 'v');
                        zalogaCell.appendChild(vEl);
                    }
                    vEl.textContent = String(newZaloga);
                    break;
                }

                if (!found) {
                    showStatus(`Materiala s šifro "${materialCode}" nisem našel v datoteki.`, 'error');
                    return;
                }

                // --- Če smo dodali nov stolpec, razširimo "dimension" referenco ---
                if (addedNewColumn) {
                    const dimEl = doc.getElementsByTagNameNS(XML_NS, 'dimension')[0];
                    if (dimEl) {
                        const ref = dimEl.getAttribute('ref');
                        const parts = ref.split(':');
                        if (parts.length === 2) {
                            const endRef = splitCellRef(parts[1].match(/^([A-Z]+\d+)$/) ? parts[1] : parts[1]);
                            const newEndCol = Math.max(colLettersToIndex(endRef.colLetters), zalogaColIdx);
                            const newEnd = colIndexToLetters(newEndCol) + endRef.row;
                            dimEl.setAttribute('ref', parts[0] + ':' + newEnd);
                        }
                    }
                }

                // --- Serializiraj in zapiši nazaj v zip (dotaknemo se SAMO tega XML-a) ---
                const serializer = new XMLSerializer();
                const newSheetXml = serializer.serializeToString(doc);
                zip.file(sheetPath, newSheetXml);

                const outBuffer = await zip.generateAsync({ type: 'uint8array' });

                if (selectedFileHandle) {
                    const writable = await selectedFileHandle.createWritable();
                    await writable.write(outBuffer);
                    await writable.close();
                    showStatus(`Zaloga uspešno spremenjena!<br>Prejšnja zaloga: ${initialZaloga}<br>Nova zaloga: ${newZaloga}<br><br><b>Datoteka ${selectedFile.name} je bila uspešno posodobljena (formatiranje ohranjeno).</b>`, 'success');
                } else {
                    const blob = new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = selectedFile.name;
                    a.click();
                    showStatus(`Zaloga uspešno spremenjena!<br>Prejšnja zaloga: ${initialZaloga}<br>Nova zaloga: ${newZaloga}<br><br><b>Prenos posodobljene datoteke se je začel.</b>`, 'success');
                }

                document.getElementById('quantity').value = '';

            } catch (err) {
                console.error(err);
                showStatus('Napaka pri obdelavi datoteke: ' + err.message, 'error');
            }
        });

        // Vstavi celico v vrstico na pravilno mesto glede na naraščajoč vrstni red stolpcev
        function insertCellInOrder(rowEl, newCell, colIdx) {
            const cells = rowEl.getElementsByTagNameNS(XML_NS, 'c');
            let inserted = false;
            for (let i = 0; i < cells.length; i++) {
                const { colLetters } = splitCellRef(cells[i].getAttribute('r'));
                if (colLettersToIndex(colLetters) > colIdx) {
                    rowEl.insertBefore(newCell, cells[i]);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) rowEl.appendChild(newCell);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = type === 'success' ? 'status-success' : 'status-error';
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
